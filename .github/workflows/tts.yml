name: "Text to Speech (Piper - Ngoc Huyen)"

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Nội dung văn bản cần đọc"
        required: true
        default: "Xin chào các bạn, đây là giọng đọc Ngọc Huyền."
        type: string
      filename:
        description: "Tên file âm thanh đầu ra"
        required: true
        default: "audio_ngoc_huyen"
        type: string
      speed:
        description: "Chọn tốc độ đọc"
        required: true
        default: "1.0 (Bình thường)"
        type: choice
        options:
          - "0.8 (Đọc nhanh)"
          - "1.0 (Bình thường)"
          - "1.2 (Đọc chậm)"
          - "1.5 (Đọc rất chậm)"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lay gia tri toc do
        id: parse_speed
        run: |
          SELECTED="${{ github.event.inputs.speed }}"
          if [[ "$SELECTED" == *"0.8"* ]]; then
            echo "scale=0.8" >> $GITHUB_OUTPUT
          elif [[ "$SELECTED" == *"1.2"* ]]; then
            echo "scale=1.2" >> $GITHUB_OUTPUT
          elif [[ "$SELECTED" == *"1.5"* ]]; then
            echo "scale=1.5" >> $GITHUB_OUTPUT
          else
            echo "scale=1.0" >> $GITHUB_OUTPUT
          fi

      - name: Tạo file âm thanh giọng Ngọc Huyền
        run: |
          python synth.py \
            --text "${{ github.event.inputs.text }}" \
            --out "${{ github.event.inputs.filename }}.wav" \
            --length-scale ${{ steps.parse_speed.outputs.scale }}

      - name: Tải file về (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.filename }}
          path: "${{ github.event.inputs.filename }}.wav"
