name: Tao Audio Giong Ngoc Huyen

on:
  workflow_dispatch:
    inputs:
      voice_choice:
        description: 'Chon giong doc'
        required: true
        default: 'Piper - Ngoc Huyen'
        type: choice
        options:
        - 'Piper - Ngoc Huyen'
      speed_choice:
        description: 'Chon toc do doc'
        required: true
        default: '+0% (Chuan 1.0x)'
        type: choice
        options:
        - '+0% (Chuan 1.0x)'
        - '+25% (Nhanh 1.25x)'
        - '+50% (Nhanh 1.5x)'
        - '-20% (Cham 0.8x)'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cai dat thu vien phu thuoc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tao file audio WAV tu kichban.txt
        run: |
          SPEED="${{ github.event.inputs.speed_choice }}"
          
          # Quy doi toc do sang tham so length-scale cua Piper
          if [[ "$SPEED" == *"+25%"* ]]; then
            SCALE="0.8"
          elif [[ "$SPEED" == *"+50%"* ]]; then
            SCALE="0.67"
          elif [[ "$SPEED" == *"-20%"* ]]; then
            SCALE="1.25"
          else
            SCALE="1.0"
          fi

          # Doc file kichban.txt an toan va tao file audio
          python -c "
          import subprocess
          with open('kichban.txt', 'r', encoding='utf-8') as f:
              text_content = f.read().strip()
          
          subprocess.run([
              'python', 'synth.py',
              '--text', text_content,
              '--out', 'audio_youtube.wav',
              '--length-scale', '$SCALE'
          ], check=True)
          "

      - name: Tai file WAV ve
        uses: actions/upload-artifact@v4
        with:
          name: audio-output
          path: audio_youtube.wav
