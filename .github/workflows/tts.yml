name: "Text to Speech (Piper - Ngoc Huyen)"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Chọn nguồn văn bản"
        required: true
        default: "Lấy từ file kichban.txt"
        type: choice
        options:
          - "Lấy từ file kichban.txt"
          - "Nhập trực tiếp ở ô bên dưới"
      text:
        description: "Văn bản nhập trực tiếp (nếu không dùng file)"
        required: false
        default: "Xin chào các bạn, đây là giọng đọc Ngọc Huyền."
        type: string
      filename:
        description: "Tên file âm thanh đầu ra"
        required: true
        default: "audio_ngoc_huyen"
        type: string
      speed:
        description: "Chọn tốc độ đọc"
        required: true
        default: "1.0 (Bình thường)"
        type: choice
        options:
          - "0.8 (Đọc nhanh)"
          - "1.0 (Bình thường)"
          - "1.2 (Đọc chậm)"
          - "1.5 (Đọc rất chậm)"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lấy giá trị tốc độ
        id: parse_speed
        run: |
          SELECTED="${{ github.event.inputs.speed }}"
          if [[ "$SELECTED" == *"0.8"* ]]; then
            echo "scale=0.8" >> $GITHUB_OUTPUT
          elif [[ "$SELECTED" == *"1.2"* ]]; then
            echo "scale=1.2" >> $GITHUB_OUTPUT
          elif [[ "$SELECTED" == *"1.5"* ]]; then
            echo "scale=1.5" >> $GITHUB_OUTPUT
          else
            echo "scale=1.0" >> $GITHUB_OUTPUT
          fi

      - name: Xử lý văn bản và Tạo Audio
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_TEXT: ${{ github.event.inputs.text }}
          SPEED_SCALE: ${{ steps.parse_speed.outputs.scale }}
          OUT_FILE: ${{ github.event.inputs.filename }}.wav
        run: |
          python -c '
          import os, sys, subprocess

          source = os.environ.get("INPUT_SOURCE", "")
          custom_text = os.environ.get("INPUT_TEXT", "")
          scale = os.environ.get("SPEED_SCALE", "1.0")
          out_file = os.environ.get("OUT_FILE", "audio.wav")

          if "kichban.txt" in source:
              if os.path.exists("kichban.txt"):
                  with open("kichban.txt", "r", encoding="utf-8") as f:
                      text_content = f.read().strip()
              else:
                  print("CẢNH BÁO: Không tìm thấy kichban.txt, chuyển sang đọc văn bản ô nhập.")
                  text_content = custom_text
          else:
              text_content = custom_text

          if not text_content:
              print("LỖI: Nội dung văn bản trống!")
              sys.exit(1)

          subprocess.run(["python", "synth.py", "--text", text_content, "--out", out_file, "--length-scale", scale], check=True)
          '

      - name: Tải file về (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.filename }}
          path: "${{ github.event.inputs.filename }}.wav"
